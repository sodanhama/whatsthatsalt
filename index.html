<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Preliminary tests</title>
</head>
<body>
    <header>
        <nav>
            <a href="./index.html">PRELIMINARY TESTS</a> > 
            <a href="./anion.html">anion identification</a> >
            <a href="./cation.html">cation identification</a> |
            <a href="./wiki.html">wiki</a>
        </nav>
    </header>
    <main>
        <h2>Physical tests</h2>
        <select id="color" name="color" required>
            <option value="" selected disabled hidden>select a color</option>
            <option value="absence of Cu^2+, Fe^2+, Fe^3+, Ni^2+, Mn^2+">white</option>
            <option value="presence of Cu^2+">blue or bluish green</option>
            <option value="presence of Fe^2+">light green</option>
            <option value="presence of Fe^3+">dark brown</option>
            <option value="presence of Ni^2+">green</option>
            <option value="presence of Co^2+">pink</option>
            <option value="presence of Mn^2+">light pink, flesh, or earthy</option>
        </select>
        <select id="smell" name="smell" required>
            <option value="" selected disabled hidden>select a smell</option>
            <option value="nothing">no smell</option>
            <option value="presence of NH_3^4+">ammoniacal smell</option>
            <option value="presence of CH_3COOH^-">vinegar like smell</option>
            <option value="presence of S^2-">rotten egg like smell</option>
        </select>
        <select id="dry-heating" name="dry-heating" required>
            <optgroup label="gas evolved">
                <option value="" selected disabled hidden>select a gas evolved</option>
                <option value="presence of CO_3^2- or C_2O_4^2-">colorless and odorless gas</option>
                <option value="presence of S^2-">colorless gas with a smell of rotten eggs</option>
                <option value="presence of SO_3^2-">colorless gas with a sulphur smell</option>
                <option value="presence of Cl^-">colorless gas with a pungent smell</option>
                <option value="presence of CH_3COOH^-">colorless gas with a smell of vinegar</option>
                <option value="presence of NH_3^4+">colorless gas with a characteristic ammonia smell</option>
                <option value="presence of NO_2^- or NO_3^- or Br^-">reddish brown gas with a pungent smell</option>
                <option value="presence of Cl_2">greenish yellow gas with a pungent smell</option>
                <option value="presence of I_2">dark violet gas with a pungent smell</option>
            </optgroup>
            <optgroup label="color change">
                <option value="" selected disabled hidden>select a color change</option>
                <option value="presence of Zn^2+">yellow when white and white when cold</option>
                <option value="presence of Pb^2+">brown when hot and yellow when cold</option>
                <option value="presence of CH_3COOH^-">white salt becomes black on heating</option>
            </optgroup>
        </select>
    </select>
    <p id="description"></p>
    </main>
    <footer>
        <p>
            made with <3 by <a href="https://github.com/sodanhama" target="_blank">sodanhama</a>
        </p>
    </footer>
    <script src="./index.js"></script>
</body>
</html>
